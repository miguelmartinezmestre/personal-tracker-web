services:
    mysql:
        container_name: convex-mysql-metricas
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        ports:
            - '127.0.0.1:3306:3306'
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
            - MYSQL_DATABASE=convex_self_hosted
        volumes:
            - ./mysql-data:/var/lib/mysql
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    maildev:
        container_name: maildev-metricas
        image: maildev/maildev:3.0.0@sha256:6e09695961f4aef9016a390ad391314a078220216601b15a35d389a7df2a3855
        ports:
            - '127.0.0.1:${MAILDEV_SMTP_PORT:-1025}:1025'
            - '127.0.0.1:${MAILDEV_WEB_PORT:-1080}:1080'
        restart: unless-stopped
        environment:
            # The backend always authenticates over plain SMTP with these credentials.
            - MAILDEV_INCOMING_USER=maildev
            - MAILDEV_INCOMING_PASS=maildev
        healthcheck:
            test: ['CMD', 'node', 'dist/bin/healthcheck.js']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    backend:
        container_name: convex-backend-metricas
        # Release a3538c6, the same as E2E_CONVEX_BACKEND_VERSION in scripts/run-e2e-stack.ts.
        image: ghcr.io/convex/convex-backend@sha256:d3338c4a78b622aa4d8b8ed6cdb114d8f7610efc91cdf61769c39314b79bb881
        depends_on:
            mysql:
                condition: service_healthy
            maildev:
                condition: service_healthy
        restart: on-failure
        stop_grace_period: 10s
        stop_signal: SIGINT
        ports:
            - '127.0.0.1:${PORT:-3210}:3210'
            - '127.0.0.1:${SITE_PROXY_PORT:-3211}:3211'
        volumes:
            - ./data:/convex/data
        environment:
            - INSTANCE_NAME=${INSTANCE_NAME:-}
            - INSTANCE_SECRET=${INSTANCE_SECRET:-}
            - CONVEX_RELEASE_VERSION_DEV=${CONVEX_RELEASE_VERSION_DEV:-}
            - ACTIONS_USER_TIMEOUT_SECS=${ACTIONS_USER_TIMEOUT_SECS:-}
            - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PORT:-3210}}
            - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${SITE_PROXY_PORT:-3211}}
            - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
            - DISABLE_BEACON=${DISABLE_BEACON:-1}
            - REDACT_LOGS_TO_CLIENT=${REDACT_LOGS_TO_CLIENT:-}
            - DO_NOT_REQUIRE_SSL=${DO_NOT_REQUIRE_SSL:-1}
            - POSTGRES_URL=${POSTGRES_URL:-}
            - MYSQL_URL=${MYSQL_URL:?MYSQL_URL must be set}
            - RUST_LOG=${RUST_LOG:-info}
            - RUST_BACKTRACE=${RUST_BACKTRACE:-}
            - AWS_REGION=${AWS_REGION:-}
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
            - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
            - S3_STORAGE_EXPORTS_BUCKET=${S3_STORAGE_EXPORTS_BUCKET:-}
            - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET=${S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET:-}
            - S3_STORAGE_MODULES_BUCKET=${S3_STORAGE_MODULES_BUCKET:-}
            - S3_STORAGE_FILES_BUCKET=${S3_STORAGE_FILES_BUCKET:-}
            - S3_STORAGE_SEARCH_BUCKET=${S3_STORAGE_SEARCH_BUCKET:-}
            - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3210/version']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 60s

    dashboard:
        container_name: convex-dashboard-metricas
        image: ghcr.io/convex/convex-dashboard@sha256:6320593f529ab6210d4da473c7f84e491e5d6adbd86c26fb5cc3001c6c32ae42
        depends_on:
            backend:
                condition: service_healthy
        stop_grace_period: 10s
        stop_signal: SIGINT
        ports:
            - '127.0.0.1:${DASHBOARD_PORT:-6791}:6791'
        environment:
            - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:${PORT:-3210}}
