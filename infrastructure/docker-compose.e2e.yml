services:
    mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        environment:
            - MYSQL_ROOT_PASSWORD=root
            - MYSQL_DATABASE=convex_self_hosted
        volumes:
            - mysql-e2e-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    maildev:
        image: maildev/maildev:3.0.0@sha256:6e09695961f4aef9016a390ad391314a078220216601b15a35d389a7df2a3855
        ports:
            - '127.0.0.1:${MAILDEV_SMTP_PORT:-2026}:1025'
            - '127.0.0.1:${MAILDEV_WEB_PORT:-1081}:1080'
        environment:
            # The backend always authenticates over plain SMTP with these credentials.
            - MAILDEV_INCOMING_USER=maildev
            - MAILDEV_INCOMING_PASS=maildev
        healthcheck:
            test: ['CMD', 'node', 'dist/bin/healthcheck.js']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    backend:
        # Release 1447815, the same as E2E_CONVEX_BACKEND_VERSION in scripts/run-e2e-stack.ts.
        image: ghcr.io/convex/convex-backend@sha256:d52c213b4c24b49f5b60bd2ca4eec66f164e137e37c5237e924da2489ce357a1
        depends_on:
            mysql:
                condition: service_healthy
            maildev:
                condition: service_healthy
        restart: on-failure
        stop_grace_period: 10s
        stop_signal: SIGINT
        ports:
            - '127.0.0.1:${PORT:-4210}:3210'
            - '127.0.0.1:${SITE_PROXY_PORT:-4211}:3211'
        volumes:
            - convex-e2e-data:/convex/data
        environment:
            - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:${PORT:-4210}
            - CONVEX_SITE_ORIGIN=http://127.0.0.1:${SITE_PROXY_PORT:-4211}
            - DATABASE_URL=mysql://root:root@mysql:3306/convex_self_hosted
            - DISABLE_BEACON=1
            - REDACT_LOGS_TO_CLIENT=1
            - DO_NOT_REQUIRE_SSL=1
            - MYSQL_URL=mysql://root:root@mysql:3306
            - RUST_LOG=info
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3210/version']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 60s

volumes:
    mysql-e2e-data:
    convex-e2e-data:
