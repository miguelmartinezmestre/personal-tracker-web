name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The version comes from `packageManager` in package.json.
            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.19.0
                  cache: pnpm

            - name: Install dependencies
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
              run: pnpm install --frozen-lockfile

            - name: Run static checks
              run: pnpm run checks:static

            - name: Run tests and enforce coverage thresholds
              run: pnpm run test:coverage

            - name: Audit production dependencies
              run: pnpm audit --prod --audit-level high

            - name: Build
              env:
                  NEXT_PUBLIC_SITE_URL: https://example.com
                  NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
                  NEXT_PUBLIC_CONVEX_SITE_URL: https://example.convex.site
              run: pnpm run build

    e2e:
        needs: quality
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.19.0
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm run playwright:install:ci

            - name: Run end-to-end suite
              run: pnpm run test:e2e:no-docker

            # The suite deploys with `convex dev --once`, which rewrites the generated code.
            - name: Check generated code drift
              run: git diff --exit-code -- convex/_generated
