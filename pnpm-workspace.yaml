# Only resolve versions published at least this many minutes ago (7 days).
minimumReleaseAge: 10080

minimumReleaseAgeExclude:
    # New charting dependency (released 2026-10-03), package contents reviewed 2026-10-06;
    # remove this exception once the seven-day cooldown has passed (2026-10-10).
    - '@tanstack/charts@1.0.0'

overrides:
    lodash: 4.18.1
    'brace-expansion@>=5.0.0 <5.0.6': 5.0.6
    glob: ^11.1.0
    js-yaml: 4.3.0
    '@babel/core': '>=7.29.1'
    esbuild: '>=0.28.1'
    postcss: '>=8.5.18'
    sharp: '>=0.35.0'
    tmp: '>=0.2.4'
    vite: 8.0.16
    ws: '>=8.21.0'
    'nanoid@<3.3.18': 3.3.18
    'browserslist@<4.28.7': 4.28.7

# kitcn 0.15.14 pins an exact, vulnerable Hono peer. Hono follows semver and
# 4.12.25+ contains the upstream CORS security fix (GHSA-88fw-hqm2-52qc).
peerDependencyRules:
    allowedVersions:
        'kitcn@0.15.14>hono': '>=4.12.25 <5'

allowBuilds:
    '@parcel/watcher': true
    '@swc/core': true
    '@tailwindcss/oxide': true
    core-js-pure: true
    esbuild: true
    sharp: true
    unrs-resolver: true
