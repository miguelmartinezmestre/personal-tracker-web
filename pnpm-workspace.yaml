# Only resolve versions published at least this many minutes ago (7 days).
minimumReleaseAge: 10080
# Temporary: better-auth 1.7.16 (2026-11-03) is the release @convex-dev/better-auth 0.13 needs.
# Remove once these releases are older than seven days (after 2026-11-11).
minimumReleaseAgeExclude:
    - better-auth
    - better-call
    - '@better-auth/*'

overrides:
    lodash: 4.18.1
    'brace-expansion@>=5.0.0 <5.0.11': 5.0.12
    glob: ^11.1.0
    js-yaml: 4.3.0
    '@babel/core': '>=7.29.1'
    esbuild: '>=0.28.1'
    postcss: '>=8.5.18'
    sharp: '>=0.35.5'
    tmp: '>=0.2.4'
    vite: 8.1.6
    ws: '>=8.21.0'
    'nanoid@<3.3.18': 3.3.18
    'browserslist@<4.28.7': 4.28.7
    undici: '>=8.10.2'
    source-map-js: '>=1.2.2'
    dompurify: '>=3.4.17'
    'zod@>=4.0.0 <5': 4.6.7
    'nodemailer@<10.1.4': 10.1.4
    'picomatch@>=4.0.0 <5': 4.0.7
    '@maildev/mcp>zod': '>=4.6.6'

peerDependencyRules:
    allowedVersions:
        'kitcn@0.33.11>hono': '>=4.13.11 <5'

allowBuilds:
    '@parcel/watcher': true
    '@swc/core': true
    '@tailwindcss/oxide': true
    core-js-pure: true
    esbuild: true
    sharp: true
    unrs-resolver: true
