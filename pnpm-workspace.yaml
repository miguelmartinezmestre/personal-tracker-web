# Only resolve versions published at least this many minutes ago (7 days).
minimumReleaseAge: 10080

overrides:
    lodash: 4.18.1
    'brace-expansion@>=5.0.0 <5.0.11': 5.0.12
    glob: ^11.1.0
    js-yaml: 4.3.0
    '@babel/core': '>=7.29.1'
    esbuild: '>=0.28.1'
    postcss: '>=8.5.18'
    sharp: '>=0.35.5'
    tmp: '>=0.2.4'
    vite: 8.1.6
    ws: '>=8.21.0'
    'nanoid@<3.3.18': 3.3.18
    'browserslist@<4.28.7': 4.28.7
    undici: '>=8.10.2'
    source-map-js: '>=1.2.2'
    dompurify: '>=3.4.17'
    'nodemailer@<10.0.6': 10.1.1

# kitcn 0.15.14 pins an exact, vulnerable Hono peer. Hono follows semver and
# 4.12.25+ contains the upstream CORS security fix (GHSA-88fw-hqm2-52qc).
peerDependencyRules:
    allowedVersions:
        'kitcn@0.15.14>hono': '>=4.12.25 <5'

allowBuilds:
    '@parcel/watcher': true
    '@swc/core': true
    '@tailwindcss/oxide': true
    core-js-pure: true
    esbuild: true
    sharp: true
    unrs-resolver: true
