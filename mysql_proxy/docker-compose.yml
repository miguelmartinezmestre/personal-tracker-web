services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: passwordmetricas1234
    ports:
      - '13306:3306'  # para acceder desde fuera si lo necesitas
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - mysql_network

  proxysql:
    image: proxysql/proxysql
    container_name: proxysql
    depends_on:
      - db
    ports:
      - "6032:6032"  # consola de administración
      - "6033:6033"  # puerto de cliente MySQL
    volumes:
      - ./proxysql.cnf:/etc/proxysql.cnf
    command: >
      bash -c "
        /usr/bin/proxysql --initial -f -c /etc/proxysql.cnf &&
        tail -f /dev/null
      "
    networks:
      - mysql_network
  mailhog:
        image: mailhog/mailhog
        container_name: mailhog
        ports:
            - '1025:1025'
            - '8025:8025'

volumes:
  mysql-data:
    driver: local

networks:
  mysql_network:
    driver: bridge
